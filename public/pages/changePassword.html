<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Troca de Senha - Sistema de Eventos</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="change-password-container">
    <div class="change-password-card">
      <h1>🔑 Troca Obrigatória de Senha</h1>
      <p style="color:var(--text-light);margin-bottom:20px;font-size:0.9rem;">
        Este é seu primeiro acesso. Por segurança, você deve definir uma nova senha.
      </p>

      <div class="warning-box">
        ⚠️ Sua senha atual é a senha padrão (123456). Defina uma nova senha para continuar.
      </div>

      <div id="cp-alert"></div>

      <div class="form-group">
        <label for="nova-senha">Nova Senha *</label>
        <input type="password" id="nova-senha" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="form-group">
        <label for="confirmar-senha">Confirmar Nova Senha *</label>
        <input type="password" id="confirmar-senha" placeholder="Repita a nova senha">
      </div>

      <button class="btn btn-primary btn-block" onclick="trocarSenha()">Alterar Senha e Continuar</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/changePassword.js"></script>
</body>
</html>
