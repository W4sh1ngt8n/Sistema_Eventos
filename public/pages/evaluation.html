<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação de Trabalhos - UNIEGO</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-header" id="app-header"></div>
  <div class="app-container">
    <div class="card">
      <h3>Trabalhos Atribuídos a Você</h3>
      <div id="eval-alert"></div>
      <table>
        <thead>
          <tr><th>ID</th><th>Título</th><th>Modalidade</th><th>Status</th><th>Ações</th></tr>
        </thead>
        <tbody id="lista-trabalhos"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal de Avaliação -->
  <div id="modal-avaliacao" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h3>Avaliar Trabalho</h3>
      <p id="modal-titulo" style="font-weight:600;margin-bottom:12px;"></p>
      <div class="form-group">
        <label>Nota (0,0 a 10,0) *</label>
        <input type="number" id="nota-input" min="0" max="10" step="0.1" placeholder="7,5">
      </div>
      <div class="form-group">
        <label>Parecer / Observações</label>
        <textarea id="observacoes-input" rows="4" placeholder="Digite seu parecer sobre o trabalho..."></textarea>
      </div>
      <input type="hidden" id="trabalho-id">
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-success" onclick="salvarAvaliacao()">Registrar Avaliação</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/evaluation.js"></script>
</body>
</html>
